name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Xvfb (virtual display for JavaFX tests)
      # Ubuntu runners are headless. Any JavaFX test that constructs a Stage,
      # Scene, or instantiates a Toolkit needs an X server — xvfb-run starts
      # an in-memory one for the duration of the wrapped command.
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build with Maven
      # JavaFX (org.openjfx:javafx-controls, javafx-fxml, ...) is pulled in
      # as a regular Maven dependency; the platform classifier resolves to
      # 'linux' on this runner automatically.
      run: xvfb-run -a mvn -B clean verify --file pom.xml

    - name: Check for class files that differ only in case
      # Windows and macOS file systems ignore case. Two such class files
      # overwrite each other there, so the build breaks on those systems
      # while it passes on this runner. Typical cause: an Avaje-generated
      # module class next to a hand-written one, e.g. ViewmenuModule beside
      # ViewMenuModule; give the generated one a name with @InjectModule.
      run: |
        dupes="$(find . -path '*/target/*' -name '*.class' | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
        if [ -n "$dupes" ]; then
          echo "Class files that differ only in case:"
          echo "$dupes"
          exit 1
        fi

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'
