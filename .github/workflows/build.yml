name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Xvfb (virtual display for JavaFX tests)
      # Ubuntu runners are headless. Any JavaFX test that constructs a Stage,
      # Scene, or instantiates a Toolkit needs an X server — xvfb-run starts
      # an in-memory one for the duration of the wrapped command.
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build with Maven
      # JavaFX (org.openjfx:javafx-controls, javafx-fxml, ...) is pulled in
      # as a regular Maven dependency; the platform classifier resolves to
      # 'linux' on this runner automatically.
      run: xvfb-run -a mvn -B clean verify --file pom.xml

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'
