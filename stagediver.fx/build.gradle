plugins {
    id "com.github.hierynomus.license" version "0.13.1"
    id 'org.sonarqube' version '2.2.1'
    id "io.spring.dependency-management" version "1.0.0.RELEASE"
    id 'de.qaware.seu.as.code.credentials' version '2.4.0'
}
apply plugin: 'org.sonarqube'

ext {
    weldVersion = '2.4.2.SP1'
    slf4jVersion = '1.7.23'
    logbackVersion = '1.1.10'
    arquillianVersion = '1.1.12.Final'
    vendor = 'QAware GmbH'
}
allprojects {
    apply plugin: 'maven'
    apply plugin: 'maven-publish'
    apply plugin: 'io.spring.dependency-management'

    group = 'de.qaware.stagediver.fx'
    version = '0.6-SNAPSHOT'

    dependencyManagement {
        imports {
            mavenBom "org.jboss.arquillian:arquillian-bom:${arquillianVersion}"
        }
        dependencies {
            dependency group: 'javax.enterprise', name: 'cdi-api', version: '1.2'
            dependency group: 'javax.inject', name: 'javax.inject', version: '1'
            dependency group: 'org.jboss.weld', name: 'weld-core', version: weldVersion
            dependency group: 'org.jboss.weld.se', name: 'weld-se', version: weldVersion
            dependency group: 'org.jboss.spec.javax.annotation', name: 'jboss-annotations-api_1.2_spec', version: '1.0.0.Final'

            dependency group: 'org.apache.commons', name: 'commons-lang3', version: '3.5'
            dependency group: 'org.apache.commons', name: 'commons-collections4', version: '4.1'

            dependency group: 'com.google.guava', name: 'guava', version: '21.0'

            dependency group: 'org.slf4j', name: 'slf4j-api', version: slf4jVersion
            dependency group: 'org.slf4j', name: 'slf4j-log4j12', version: slf4jVersion
            dependency group: 'org.slf4j', name: 'log4j-over-slf4j', version: slf4jVersion
            dependency group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
            dependency group: 'ch.qos.logback', name: 'logback-core', version: logbackVersion

            dependency(group: 'junit', name: 'junit', version: '4.12') {
                exclude group: 'org.hamcrest', name: 'hamcrest-core'
            }
            dependency group: 'org.loadui', name: 'testFx', version: '3.1.1'

            dependency group: 'org.jboss.arquillian.container', name: 'arquillian-weld-se-embedded-1.1', version: '1.0.0.CR8'
            dependency group: 'org.jboss.shrinkwrap', name: 'shrinkwrap-api', version: '1.2.2'

            dependency group: 'org.hamcrest', name: 'hamcrest-all', version: '1.3'
            dependency group: 'org.mockito', name: 'mockito-all', version: '1.10.19'
            dependency group: 'nl.jqno.equalsverifier', name: 'equalsverifier', version: '2.2.1'
        }
    }

    publishing {
        repositories {
            maven {
                if (project.version.endsWith('-SNAPSHOT')) {
                    url "https://www.qaware.de/nexus/content/repositories/qaware-internal-snapshots/"
                }
                else {
                    url "https://www.qaware.de/nexus/content/repositories/qaware-internal/"
                }
                credentials {
                    username qawareUsername
                    password qawarePassword
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'java'

    sourceCompatibility = 8
    targetCompatibility = 8

    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    task packageSources(type: Jar) {
        classifier = 'sources'
        from sourceSets.main.allSource
    }

    task javadocJar(type: Jar) {
        classifier = 'javadoc'
        from javadoc
    }

    jar {
        manifest {
            attributes(
                    'Implementation-Title': project.description ?: project.name,
                    'Implementation-Version': version,
                    'Implementation-Vendor-Id': project.group,
                    'Implementation-Vendor': vendor,
                    'Specification-Title': project.description ?: project.name,
                    'Specification-Version': version,
                    'Specification-Vendor': vendor
            )
        }
    }

    artifacts.archives packageSources
    repositories {
        mavenLocal()
        maven {
            url "https://www.qaware.de/nexus/content/repositories/qaware-internal/"
            credentials {
                username qawareUsername
                password qawarePassword
            }
        }
        maven {
            url "https://www.qaware.de/nexus/content/repositories/qaware-internal-snapshots"
            credentials {
                username qawareUsername
                password qawarePassword
            }
        }
        maven { url "http://repo.maven.apache.org/maven2" }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                if (tasks.findByName('jarTests') != null) {
                    artifact jarTests {
                        classifier 'tests'
                    }
                }
                artifact javadocJar
                artifact packageSources {
                    classifier 'sources'
                }
                pom.withXml {
                    def node = asNode()
                    node.appendNode('name', project.description)
                    def orga = node.appendNode('organization')
                    orga.appendNode('name', vendor)
                    orga.appendNode('url', 'http://www.qaware.de')
                }
            }
        }
    }

    apply plugin: 'jacoco'
    jacoco {
        toolVersion = '0.7.9'
    }
    dependencies {
        compile 'org.slf4j:slf4j-api'
        testCompile 'junit:junit'
        testCompile 'org.hamcrest:hamcrest-all'
        testCompile 'org.mockito:mockito-all'
        testCompile 'nl.jqno.equalsverifier:equalsverifier'
        testCompile 'ch.qos.logback:logback-classic'
    }
    test {
        if (project.hasProperty('ignoreTestFailure')) {
            ignoreFailures = ignoreTestFailure.toBoolean()
        }
    }
}
gradle.taskGraph.whenReady {
    subprojects {
        test {
            jacoco {
                def sonarActive = gradle.taskGraph.hasTask(project.rootProject.tasks['sonarqube'])
                enabled = sonarActive
                logger.info "SonarQube Analysis is ${sonarActive}. Set Jacoco Execution also to ${enabled}"
            }
        }
    }
}