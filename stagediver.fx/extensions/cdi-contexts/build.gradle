group = 'de.qaware.stagediver.fx.extensions'
description = 'stagediver.fx - Extension - CDI Contexts'
dependencies {
    compile project(':lookup')
    compile project(':windowmanager-api')

    compile 'javax.inject:javax.inject'
    compile 'org.jboss.spec.javax.annotation:jboss-annotations-api_1.2_spec'
    compile 'org.jboss.weld.se:weld-se-core'
    compile 'org.jboss.weld:weld-core-impl'

    compile 'org.slf4j:slf4j-api'

    testCompile project(':lookup-cdi')
    testCompile project(':windowmanager-core')
    testCompile project(path: ':windowmanager-api', configuration: 'tests')

    testCompile 'org.loadui:testFx'

    testCompile 'org.jboss.arquillian.container:arquillian-container-test-api'
    testCompile 'org.jboss.arquillian.junit:arquillian-junit-container'
    testCompile 'org.jboss.arquillian.junit:arquillian-junit-core'
    testCompile 'org.jboss.shrinkwrap:shrinkwrap-api'
    testCompile 'org.jboss.arquillian.container:arquillian-weld-se-embedded-1.1'
}