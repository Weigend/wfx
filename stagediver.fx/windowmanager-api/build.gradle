description = 'stagediver.fx - Window Manager API'
dependencies {
    compile project(':lookup')
    compile 'com.google.guava:guava'

    testCompile 'org.loadui:testFx'
}

task jarTests(type: Jar, dependsOn: testClasses) {
    classifier = 'tests'
    from sourceSets.test.output
}
configurations {
    tests {
        extendsFrom testRuntime
    }
}
artifacts {
    tests jarTests
}