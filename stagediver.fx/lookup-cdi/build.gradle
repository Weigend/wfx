description = 'stagediver.fx - CDI Lookup Module'
dependencies {
    compile project(':lookup')
    compile 'javax.enterprise:cdi-api'
    compile 'javax.inject:javax.inject'

    compile 'org.jboss.weld.se:weld-se'
    compile 'org.jboss.weld:weld-core'
    compile 'org.apache.commons:commons-lang3'

    testCompile project(path: ':lookup', configuration: 'tests')
    testCompile 'org.jboss.spec.javax.annotation:jboss-annotations-api_1.2_spec'
}
sourceSets {
    main {
        // Workaround for tests with CDI. Ensures the META-INF/beans.xml within the same directory as the class files.
        output.resourcesDir = 'build/classes/main'
    }
    test {
        // Workaround for tests with CDI. Ensures the META-INF/beans.xml within the same directory as the class files.
        output.resourcesDir = 'build/classes/test'
    }
}

task jarTests(type: Jar, dependsOn: testClasses) {
    classifier = 'tests'
    from sourceSets.test.output
}
configurations {
    tests {
        extendsFrom testRuntime
    }
}
artifacts {
    tests jarTests
}
